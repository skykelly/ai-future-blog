name: Generate Slide

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (HTML에서 생성)'
        required: true
      scenario:
        description: '생활 변화 시나리오'
        required: true
      category:
        description: '카테고리 포커스 (예: 1-1)'
        default: ''
      format:
        description: 'presenter_slides | detailed_deck'
        default: 'presenter_slides'
      length:
        description: 'short | default'
        default: 'short'
      lang:
        description: 'ko | en'
        default: 'ko'
      custom_prompt:
        description: '맞춤 프롬프트'
        default: ''

jobs:
  generate:
    # 자체 호스팅 러너 사용: nlm이 이미 설치·로그인된 로컬 머신에서 실행
    # 설정: GitHub repo → Settings → Actions → Runners → New self-hosted runner
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 항상 최신 코드로 pull (동시 실행 충돌 방지)
          clean: false

      - name: Generate slide
        env:
          JOB_ID:        ${{ inputs.job_id }}
          SCENARIO:      ${{ inputs.scenario }}
          CATEGORY:      ${{ inputs.category }}
          SLIDE_FORMAT:  ${{ inputs.format }}
          SLIDE_LENGTH:  ${{ inputs.length }}
          LANG:          ${{ inputs.lang }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: python3 scraper/generate_slide_ci.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/slides/ docs/data/slides.json
          git diff --staged --quiet || git commit -m "feat: 슬라이드 생성 완료 (${{ inputs.job_id }})"
          git push
