name: Add Article by URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Article URL'
        required: true
        type: string
      category_hint:
        description: 'Category hint (e.g. 1-1, 2-1) — optional'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  models: read

jobs:
  add:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          python add_article.py \
            --url "${{ github.event.inputs.url }}" \
            --category-hint "${{ github.event.inputs.category_hint }}"

      - name: Verify insert
        run: |
          python3 -c "
          import os, sys
          sys.path.insert(0, 'scraper')
          from supabase_client import get_total_count
          print(f'Supabase 총 아티클: {get_total_count()}개')
          " || echo "Supabase 카운트 확인 실패"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-article-log-${{ github.run_id }}
          path: scraper/add_article.log
          retention-days: 14
